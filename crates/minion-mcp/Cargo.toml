[package]
name = "minion-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.92"
minion-core = { version = "0.1.0", path = "../minion-core" }
# The client half of MCP: `client` brings the request builders and
# `transport-child-process` the stdio child process a configured server is
# spawned into. The default `server` feature stays on because `mcp serve` (M6)
# and the stub server under `src/bin/` need it.
rmcp = { version = "3.5.0", features = ["client", "transport-child-process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = [
    "sync",
    "rt",
    "rt-multi-thread",
    "macros",
    "process",
    "io-std",
    "io-util",
    "time",
] }
tokio-util = "0.7.19"
tracing = "0.1.44"

# A minimal, protocol-correct MCP server used by the MCP client tests, and handy
# for trying the client against something real without installing a server. It
# is a fixture, not part of the shipped CLI: `cargo install minion-cli` installs
# only that package's binary.
[[bin]]
name = "mcp-stub-server"
path = "src/bin/mcp_stub_server.rs"
doc = false

[dev-dependencies]
futures = "0.3.34"
insta = { version = "1.43.1", features = ["json"] }
tempfile = "3.27.0"
