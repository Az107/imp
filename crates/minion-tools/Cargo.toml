[package]
name = "minion-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.92"
libc = "0.2.189"
minion-core = { version = "0.1.0", path = "../minion-core" }
schemars = { version = "1.2.2", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.2.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["sync", "time", "macros", "rt", "fs", "io-util", "process"] }
tokio-util = "0.7.19"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
