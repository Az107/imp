[package]
name = "imp-cron"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
# IANA timezones. The `cron` crate is generic over `TimeZone` and ships no
# database of its own, so a job's `timezone` means nothing without this.
chrono-tz = "0.10.4"
cron = "0.17.0"
imp-core = { version = "0.1.0", path = "../imp-core" }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["sync", "time", "rt", "macros", "rt-multi-thread"] }
tokio-util = "0.7.19"
tracing = "0.1.44"

[dev-dependencies]
imp-store = { version = "0.1.0", path = "../imp-store" }
tempfile = "3.27.0"
