[package]
name = "minion-guard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.92"
minion-core = { version = "0.1.0", path = "../minion-core" }
# The guard speaks the same `/v1/systemone` protocol over the same client the
# rest of the workspace links, so this adds an edge, not a second HTTP stack.
# The JSON feature is deliberately not enabled: the request body is serialized
# and the reply is read as text, so a permissive parser cannot be blamed for
# what a strict `parse_verdict` rejects.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["sync", "time", "macros", "rt", "rt-multi-thread", "net", "io-util"] }
tracing = "0.1.44"
