[package]
name = "minion-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
libc = "0.2.189"
minion-core = { version = "0.1.0", path = "../minion-core" }
minion-cron = { version = "0.1.0", path = "../minion-cron" }
minion-provider = { version = "0.1.0", path = "../minion-provider" }
minion-store = { version = "0.1.0", path = "../minion-store" }
minion-tools = { version = "0.1.0", path = "../minion-tools" }
pulldown-cmark = "0.13.4"
rustyline = "18.0.1"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "process", "time", "sync", "io-std", "io-util"] }
tokio-util = "0.7.19"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[[bin]]
name = "minion"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27.0"
